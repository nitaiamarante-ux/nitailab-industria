<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Modo dono</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A1814;color:#EDE6D8;font:18px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
main{max-width:420px}
h1{font-size:22px;margin:0 0 12px}
p{margin:0 0 20px;color:#B9B0A0}
button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid #6b6455;background:transparent;color:#EDE6D8;cursor:pointer}
</style>
</head>
<body>
<main>
<h1 id="t">Um instante</h1>
<p id="p"></p>
<button id="b" type="button" hidden></button>
</main>
<script>
(function(){
var t=document.getElementById("t"),p=document.getElementById("p"),b=document.getElementById("b");
function tela(){var on=false;try{on=localStorage.getItem("nl_dono")==="1";}catch(e){}
if(on){t.textContent="Este navegador não conta mais nas visitas";p.textContent="As suas visitas e cliques neste aparelho não entram na medição.";b.textContent="Voltar a contar";b.hidden=false;}
else{t.textContent="Este navegador volta a contar nas visitas";p.textContent="As suas visitas neste aparelho entram na medição como as de qualquer pessoa.";b.textContent="Parar de contar de novo";b.hidden=false;}
return on;}
try{localStorage.setItem("nl_dono","1");}catch(e){t.textContent="Não consegui gravar";p.textContent="Este navegador bloqueia o armazenamento local.";}
if(!t.textContent||t.textContent==="Um instante")tela();
b.addEventListener("click",function(){var on=false;try{on=localStorage.getItem("nl_dono")==="1";
if(on)localStorage.removeItem("nl_dono");else localStorage.setItem("nl_dono","1");}catch(e){}tela();});
})();
</script>
</body>
</html>
